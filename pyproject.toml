[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "shieldlab"
version = "0.3.0"
description = "Inspect finite safety, first-goal and recurrent-target games with complete strategy evidence"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
shieldlab = "shieldlab.__main__:main"
shieldlab-reachavoid = "shieldlab.reachavoid_cli:main"
shieldlab-recurrence = "shieldlab.recurrence_cli:main"
[tool.setuptools]
packages = ["shieldlab"]
