[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "shieldlab"
version = "0.1.0"
description = "Inspect exact finite turn-based safety games and every strategy obligation"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
shieldlab = "shieldlab.__main__:main"
[tool.setuptools]
packages = ["shieldlab"]
